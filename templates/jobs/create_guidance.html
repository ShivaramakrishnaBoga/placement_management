{% extends 'dashboard/dashboard_base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-soft p-4">
            <h3 class="mb-4">Add Guidance Resource</h3>
            <h5 class="text-muted mb-4">{{ job.company_name }} - {{ job.title }}</h5>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label">Round Name</label>
                    <input type="text" name="round_name" class="form-control" placeholder="e.g. Round 1: Aptitude" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Resource Title</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g. 50 Most Asked Questions" required>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Resource Type</label>
                        <select name="resource_type" class="form-select">
                            <option value="LINK">External Link / Youtube</option>
                            <option value="PDF">PDF Document</option>
                            <option value="VIDEO">Video File</option>
                            <option value="TEXT">Plain Text Tip</option>
                        </select>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Upload File (Optional)</label>
                    <input type="file" name="file" class="form-control">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">External Link (Optional)</label>
                    <input type="url" name="link" class="form-control" placeholder="https://...">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Description / Instructions</label>
                    <textarea name="description" class="form-control" rows="3"></textarea>
                </div>

                <div class="d-flex justify-content-between mt-4">
                     <a href="{% url 'guidance_list' %}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-success px-4">
                        <i class="bi bi-upload"></i> Upload Resource
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
