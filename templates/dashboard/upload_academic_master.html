{% extends 'dashboard/dashboard_base.html' %}
{% block content %}

<div class="container-fluid">
    <h2 class="mb-4">Upload Academic Master Data</h2>

    <div class="card shadow-soft p-4" style="max-width: 600px; margin: 0 auto;">
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="mb-4">
                <label for="file" class="form-label">Select Excel File (.xlsx)</label>
                <input type="file" name="file" id="file" class="form-control" accept=".xlsx" required>
                <div class="form-text">
                    File must contain columns: Roll Number, Name, Branch, Year, CGPA, Backlogs
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-upload"></i> Upload Data
            </button>
        </form>

    </div>
</div>

{% endblock %}
